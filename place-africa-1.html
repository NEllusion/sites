<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Place Africa</title>
<style>
  :root{
    --ocean:#0B2027;--ocean-2:#0E2932;--grat:#244049;--ink:#F2EDE4;--muted:#7E9AA3;
    --guess:#3DF0E6;--answer:#FF1F3D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #102e38 0%, var(--ocean) 60%);
    color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px;
  }
  .app{width:100%;max-width:640px;}
  .bar{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--grat);
    border-radius:10px;padding:10px 14px;background:linear-gradient(var(--ocean-2),var(--ocean));}
  .brand{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;}
  .brand b{color:#D9A05B;font-weight:600;}
  .readout{display:flex;gap:22px;}
  .stat{text-align:right;}
  .stat span{display:block;font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
  .stat strong{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;font-weight:600;color:var(--ink);}
  .prompt{padding:22px 4px 14px;}
  .prompt .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.34em;color:var(--guess);text-transform:uppercase;}
  .prompt h1{margin:6px 0 0;font-size:clamp(28px,8vw,40px);line-height:1.04;font-weight:700;letter-spacing:-.01em;}
  .map-wrap{position:relative;border:1px solid var(--grat);border-radius:12px;overflow:hidden;}
  svg#map{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;background:#0E2932;}
  svg#map.locked{cursor:default;}
  .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-family:ui-monospace,Menlo,monospace;
    font-size:11px;letter-spacing:.04em;color:var(--muted);background:rgba(11,32,39,.72);padding:5px 12px;border-radius:99px;
    border:1px solid var(--grat);pointer-events:none;white-space:nowrap;}
  .mode{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0;display:flex;align-items:center;gap:7px;}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--muted);flex:none;}
  .dot.real{background:#52d273;}.dot.approx{background:#e0a64b;}.dot.load{background:#5b9ad2;}
  .result{margin-top:12px;border:1px solid var(--grat);border-radius:12px;padding:14px 16px;background:var(--ocean-2);
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;}
  .result[hidden]{display:none;}
  .verdict{font-size:15px;font-weight:700;}
  .result .dist{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:2px;}
  .pts{font-family:ui-monospace,Menlo,monospace;text-align:right;}
  .pts span{display:block;font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
  .pts strong{font-size:24px;color:var(--guess);}
  .swatch{width:6px;align-self:stretch;border-radius:3px;background:var(--guess);}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;}
  .toggle input{accent-color:var(--guess);width:16px;height:16px;}
  button{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--guess);color:#06262a;border:none;border-radius:8px;padding:12px 26px;font-weight:700;cursor:pointer;
    transition:transform .08s ease,filter .15s ease;}
  button:hover{filter:brightness(1.08);}button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  button[hidden]{display:none;}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--grat);}
  .final{border:1px solid var(--grat);border-radius:12px;background:var(--ocean-2);padding:30px 22px;text-align:center;margin-top:14px;}
  .final[hidden]{display:none;}
  .final .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.3em;color:var(--guess);text-transform:uppercase;}
  .final .big{font-family:ui-monospace,Menlo,monospace;font-size:46px;font-weight:700;margin:10px 0 2px;}
  .final .of{color:var(--muted);font-size:14px;}
  .final .grade{font-size:20px;font-weight:700;margin:14px 0 20px;color:#D9A05B;}
  @media (max-width:430px){.readout{gap:16px;}.result{grid-template-columns:auto 1fr;}.pts{grid-column:2;text-align:left;margin-top:4px;}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><b>◐</b>&nbsp; Place&nbsp;Africa</div>
    <div class="readout">
      <div class="stat"><span>Round</span><strong id="roundNum">1 / 10</strong></div>
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
    </div>
  </div>
  <div class="prompt">
    <div class="eyebrow">Locate the country</div>
    <h1 id="country">Loading…</h1>
  </div>
  <div class="map-wrap">
    <svg id="map" viewBox="0 0 620 555" role="img" aria-label="Map of Africa. Tap where you think the country is."></svg>
    <div class="hint" id="hint">Tap the map where you think it is</div>
  </div>
  <div class="mode" id="mode"><span class="dot load"></span><span id="modeText">Loading map data…</span></div>
  <div class="result" id="result" hidden>
    <div class="swatch"></div>
    <div><div class="verdict" id="verdict"></div><div class="dist" id="distLine"></div></div>
    <div class="pts"><span>Points</span><strong id="roundPts">0</strong></div>
  </div>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="islands"> Include island nations</label>
    <button id="next" hidden>Next →</button>
  </div>
  <div class="final" id="final" hidden>
    <div class="eyebrow">Expedition complete</div>
    <div class="big"><span id="finalScore">0</span></div>
    <div class="of">out of <span id="finalMax">10000</span> possible</div>
    <div class="grade" id="grade"></div>
    <button class="ghost" id="again">Play again</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var W=620,H=555;
  var $=function(id){return document.getElementById(id);};
  var svg=document.getElementById("map");
  var NS="http://www.w3.org/2000/svg";
  function el(t,a){var e=document.createElementNS(NS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);return e;}

  // ---- map-only zoom/pan: mutate the SVG viewBox so getScreenCTM() (used by the
  //      guess handler) stays correct at any zoom level, no scoring changes needed ----
  var ASPECT=H/W, MIN_W=W/8;                 // up to ~8x zoom-in
  var view={x:0,y:0,w:W,h:H};
  function applyView(){ svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+view.h); }
  function clampView(){
    view.w=Math.max(MIN_W,Math.min(W,view.w)); view.h=view.w*ASPECT;
    view.x=Math.max(0,Math.min(W-view.w,view.x));
    view.y=Math.max(0,Math.min(H-view.h,view.y));
  }
  function resetView(){ view={x:0,y:0,w:W,h:H}; applyView(); }
  function screenToMap(cx,cy){
    var p=svg.createSVGPoint(); p.x=cx; p.y=cy;
    var l=p.matrixTransform(svg.getScreenCTM().inverse()); return [l.x,l.y];
  }
  function zoomAt(fx,fy,factor){
    var newW=Math.max(MIN_W,Math.min(W,view.w*factor)), newH=newW*ASPECT;
    view.x=fx-(fx-view.x)*(newW/view.w);
    view.y=fy-(fy-view.y)*(newH/view.h);
    view.w=newW; view.h=newH; clampView(); applyView();
  }

  // bounding box of the view (lon/lat)
  var lonMin=-26,lonMax=60,latMin=-37,latMax=40;

  // ---- African countries: ISO numeric code (for real borders) + fallback centroid/area ----
  var AFRICA=[
    {code:12,n:"Algeria",lat:28.0,lon:1.7,a:2381741},{code:24,n:"Angola",lat:-11.2,lon:17.9,a:1246700},
    {code:204,n:"Benin",lat:9.3,lon:2.3,a:112622},{code:72,n:"Botswana",lat:-22.3,lon:24.7,a:581730},
    {code:854,n:"Burkina Faso",lat:12.2,lon:-1.6,a:274200},{code:108,n:"Burundi",lat:-3.4,lon:29.9,a:27830},
    {code:120,n:"Cameroon",lat:6.5,lon:12.5,a:475442},{code:140,n:"Central African Republic",lat:6.6,lon:20.9,a:622984},
    {code:148,n:"Chad",lat:15.4,lon:18.7,a:1284000},{code:178,n:"Republic of the Congo",lat:-0.7,lon:15.4,a:342000},
    {code:180,n:"DR Congo",lat:-2.9,lon:23.6,a:2344858},{code:384,n:"Côte d'Ivoire",lat:7.5,lon:-5.5,a:322463},
    {code:262,n:"Djibouti",lat:11.8,lon:42.6,a:23200},{code:818,n:"Egypt",lat:26.8,lon:30.8,a:1001450},
    {code:226,n:"Equatorial Guinea",lat:1.6,lon:10.3,a:28051},{code:232,n:"Eritrea",lat:15.2,lon:39.0,a:117600},
    {code:748,n:"Eswatini",lat:-26.5,lon:31.5,a:17364},{code:231,n:"Ethiopia",lat:9.1,lon:40.0,a:1104300},
    {code:266,n:"Gabon",lat:-0.8,lon:11.6,a:267668},{code:270,n:"The Gambia",lat:13.4,lon:-15.4,a:11295},
    {code:288,n:"Ghana",lat:7.9,lon:-1.0,a:238533},{code:324,n:"Guinea",lat:10.4,lon:-10.9,a:245857},
    {code:624,n:"Guinea-Bissau",lat:12.0,lon:-15.0,a:36125},{code:404,n:"Kenya",lat:0.2,lon:37.9,a:580367},
    {code:426,n:"Lesotho",lat:-29.6,lon:28.2,a:30355},{code:430,n:"Liberia",lat:6.4,lon:-9.4,a:111369},
    {code:434,n:"Libya",lat:26.3,lon:17.2,a:1759540},{code:450,n:"Madagascar",lat:-18.8,lon:46.9,a:587041},
    {code:454,n:"Malawi",lat:-13.3,lon:34.3,a:118484},{code:466,n:"Mali",lat:17.6,lon:-3.5,a:1240192},
    {code:478,n:"Mauritania",lat:21.0,lon:-10.9,a:1030700},{code:504,n:"Morocco",lat:31.8,lon:-6.5,a:446550},
    {code:508,n:"Mozambique",lat:-18.7,lon:35.5,a:801590},{code:516,n:"Namibia",lat:-22.0,lon:17.2,a:825615},
    {code:562,n:"Niger",lat:17.6,lon:8.1,a:1267000},{code:566,n:"Nigeria",lat:9.1,lon:8.7,a:923768},
    {code:646,n:"Rwanda",lat:-1.9,lon:29.9,a:26338},{code:686,n:"Senegal",lat:14.5,lon:-14.5,a:196722},
    {code:694,n:"Sierra Leone",lat:8.5,lon:-11.8,a:71740},{code:706,n:"Somalia",lat:5.2,lon:46.2,a:637657},
    {code:710,n:"South Africa",lat:-29.0,lon:24.8,a:1221037},{code:728,n:"South Sudan",lat:7.3,lon:30.2,a:619745},
    {code:729,n:"Sudan",lat:15.5,lon:30.2,a:1861484},{code:834,n:"Tanzania",lat:-6.4,lon:34.9,a:945087},
    {code:768,n:"Togo",lat:8.6,lon:0.8,a:56785},{code:788,n:"Tunisia",lat:34.0,lon:9.6,a:163610},
    {code:800,n:"Uganda",lat:1.4,lon:32.3,a:241550},{code:894,n:"Zambia",lat:-13.1,lon:27.8,a:752618},
    {code:716,n:"Zimbabwe",lat:-19.0,lon:29.9,a:390757},
    {code:132,n:"Cabo Verde",lat:16.0,lon:-24.0,a:4033,island:true},{code:174,n:"Comoros",lat:-11.9,lon:43.9,a:2235,island:true},
    {code:480,n:"Mauritius",lat:-20.3,lon:57.6,a:2040,island:true},{code:690,n:"Seychelles",lat:-4.7,lon:55.5,a:459,island:true},
    {code:678,n:"São Tomé and Príncipe",lat:0.2,lon:6.6,a:964,island:true}
  ];

  // hand-traced coastline for the fallback base (lon,lat)
  var MAINLAND=[[-5.6,35.8],[0.0,36.5],[5.0,37.0],[10.5,37.0],[11.0,33.5],[15.0,31.5],[20.0,32.0],[25.0,32.0],[29.0,31.0],[31.5,31.4],[32.5,29.9],[34.0,28.0],[35.5,24.0],[37.0,22.0],[38.5,18.0],[39.5,15.5],[40.5,14.5],[43.3,12.7],[44.0,10.4],[48.0,11.0],[51.3,11.8],[50.0,8.0],[47.5,4.0],[44.0,1.5],[41.5,-1.5],[40.0,-3.0],[39.5,-6.5],[40.5,-10.5],[40.5,-14.5],[37.0,-17.5],[35.5,-20.0],[35.0,-23.5],[32.9,-25.9],[32.0,-28.5],[29.0,-31.5],[27.0,-33.3],[22.0,-34.0],[20.0,-34.8],[18.4,-34.0],[17.5,-32.5],[15.0,-27.0],[14.5,-22.5],[13.0,-18.0],[12.0,-17.0],[13.8,-12.5],[13.4,-8.8],[12.5,-6.0],[13.0,-4.8],[11.8,-3.0],[9.3,-0.6],[9.5,2.0],[9.7,4.0],[8.5,4.5],[6.0,4.3],[4.0,6.2],[1.0,6.0],[-1.0,5.0],[-3.5,5.0],[-7.5,4.3],[-9.0,5.0],[-11.5,6.5],[-13.5,9.5],[-15.5,11.5],[-16.5,13.5],[-17.5,14.7],[-16.5,16.0],[-16.5,19.0],[-17.0,21.0],[-15.5,24.0],[-13.5,27.5],[-10.0,30.0],[-9.3,32.5],[-6.8,34.0]];
  var MADAGASCAR=[[49.3,-12.0],[50.5,-15.5],[49.8,-18.5],[48.5,-21.5],[47.0,-24.5],[45.2,-25.6],[44.0,-22.0],[43.3,-19.0],[44.2,-16.0],[46.3,-15.7],[47.5,-13.5]];

  // ===== engine state (mode-specific functions get filled in) =====
  var ENG={ projectXY:null, invertXY:null, score:null, drawHighlight:null, centroidXY:null };
  var fx; // marker layer

  // ---- shared helpers ----
  function biome(lat){
    if(lat>=34)return"#9fa15a"; if(lat>=30)return"#cdb87a"; if(lat>=20)return"#e6d6a4";
    if(lat>=14)return"#cdbd7e"; if(lat>=8)return"#9fae5b"; if(lat>=2)return"#6f8e3f";
    if(lat>=-4)return"#557a33"; if(lat>=-12)return"#7e9046"; if(lat>=-22)return"#b7a064";
    if(lat>=-30)return"#c2a968"; return"#8c9a56";
  }
  function defsCommon(){
    var defs=el("defs",{});
    function grad(id,stops){var g=el("linearGradient",{id:id,x1:"0",y1:"0",x2:"0",y2:"1"});
      stops.forEach(function(s){g.appendChild(el("stop",{offset:s[0],"stop-color":s[1]}));});defs.appendChild(g);}
    grad("seaGrad",[["0","#0a3a55"],["0.5","#0b2f47"],["1","#08233a"]]);
    function turb(id,bf,oct,seed,rgb,al){var f=el("filter",{id:id,x:"0",y:"0",width:"100%",height:"100%"});
      f.appendChild(el("feTurbulence",{type:"fractalNoise",baseFrequency:bf,numOctaves:oct,seed:seed,stitchTiles:"stitch",result:"n"}));
      f.appendChild(el("feColorMatrix",{"in":"n",type:"matrix",values:"0 0 0 0 "+rgb+"  0 0 0 0 "+rgb+"  0 0 0 0 "+rgb+"  "+al+" "+al+" "+al+" 0 0"}));
      defs.appendChild(f);}
    turb("terrain","0.018 0.026","4","7","0","0.7");
    turb("ripple","0.012 0.02","2","3","1","0.3");
    return defs;
  }
  function graticule(){
    var g=el("g",{stroke:"#bfe0e8","stroke-width":"0.6",opacity:"0.16"});
    for(var lon=-20;lon<=60;lon+=10){var a=ENG.projectXY(lon,latMax),b=ENG.projectXY(lon,latMin);g.appendChild(el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));}
    for(var lat=-30;lat<=40;lat+=10){var c=ENG.projectXY(lonMin,lat),d=ENG.projectXY(lonMax,lat);g.appendChild(el("line",{x1:c[0],y1:c[1],x2:d[0],y2:d[1]}));}
    return g;
  }
  function pin(x,y,color){
    var grp=el("g",{});
    function ln(x1,y1,x2,y2,c,w){grp.appendChild(el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:c,"stroke-width":w,"stroke-linecap":"round"}));}
    ln(x-7,y,x+7,y,"#06262a",4);ln(x,y-7,x,y+7,"#06262a",4);
    ln(x-7,y,x+7,y,color,1.8);ln(x,y-7,x,y+7,color,1.8);
    grp.appendChild(el("circle",{cx:x,cy:y,r:4.5,fill:"none",stroke:color,"stroke-width":"2"}));
    grp.appendChild(el("circle",{cx:x,cy:y,r:1.6,fill:color}));
    fx.appendChild(grp);
  }
  function label(x,y,text){
    var t=el("text",{x:x,y:y,"font-size":"14","font-weight":"800","text-anchor":"middle",
      "font-family":"ui-monospace,Menlo,monospace",fill:"#ffffff",stroke:"#0b2027","stroke-width":"3.5",
      "stroke-linejoin":"round","paint-order":"stroke","stroke-opacity":"0.92"});
    t.textContent=text;fx.appendChild(t);
  }
  function travelLine(gx,gy,cx,cy){
    var line=el("line",{x1:gx,y1:gy,x2:cx,y2:cy,stroke:"#F2EDE4","stroke-width":"1.6","stroke-dasharray":"4 4",opacity:"0.9"});
    fx.appendChild(line);
    var len=Math.hypot(cx-gx,cy-gy);
    line.setAttribute("stroke-dasharray",len);line.setAttribute("stroke-dashoffset",len);
    line.style.transition="stroke-dashoffset .6s ease";
    requestAnimationFrame(function(){line.setAttribute("stroke-dashoffset","0");});
  }

  // ======================= APPROX MODE (no network) =======================
  function haversine(la1,lo1,la2,lo2){var R=6371,r=Math.PI/180,dLat=(la2-la1)*r,dLon=(lo2-lo1)*r;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.sqrt(a));}
  function initApprox(){
    ENG.projectXY=function(lon,lat){return [ (lon-lonMin)/(lonMax-lonMin)*W, (latMax-lat)/(latMax-latMin)*H ];};
    ENG.invertXY=function(x,y){return [ lonMin+(x/W)*(lonMax-lonMin), latMax-(y/H)*(latMax-latMin) ];};
    var KM_PER_PX=(latMax-latMin)*111.32/H;
    ENG.centroidXY=function(t){return ENG.projectXY(t.lon,t.lat);};
    ENG.score=function(lon,lat,t){
      var d=haversine(lat,lon,t.lat,t.lon), rkm=Math.sqrt(t.a/Math.PI), edge=Math.max(0,d-rkm), inside=d<=rkm;
      return {inside:inside, edgeKm:edge, pts: inside?1000:Math.round(1000*Math.exp(-edge/700))};
    };
    ENG.drawHighlight=function(t){
      var c=ENG.centroidXY(t), x=c[0], y=c[1];
      var r=Math.max(4, Math.sqrt(t.a/Math.PI)/KM_PER_PX);
      var g=el("g",{});
      g.appendChild(el("circle",{cx:x,cy:y,r:r,fill:"#FF1F3D","fill-opacity":"0.22",stroke:"#fff","stroke-width":"4","stroke-opacity":"0.95"}));
      g.appendChild(el("circle",{cx:x,cy:y,r:r,fill:"none",stroke:"#FF1F3D","stroke-width":"2.2"}));
      g.appendChild(el("circle",{cx:x,cy:y,r:3,fill:"#fff",stroke:"#FF1F3D","stroke-width":"1.5"}));
      fx.appendChild(g);
      var ly=(y-r-9)<14?(y+r+20):(y-r-9);
      return {x:x,y:y,labelY:ly};
    };
    drawBaseApprox();
    setMode("approx");
    boot2();
  }
  function pathFromLL(pts){var d="";for(var i=0;i<pts.length;i++){var p=ENG.projectXY(pts[i][0],pts[i][1]);d+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}return d+"Z";}
  function drawBaseApprox(){
    var defs=defsCommon();
    function grad(id,stops){var g=el("linearGradient",{id:id,x1:"0",y1:"0",x2:"0",y2:"1"});
      stops.forEach(function(s){g.appendChild(el("stop",{offset:s[0],"stop-color":s[1]}));});defs.appendChild(g);}
    grad("landGrad",[["0.00","#9fa15a"],["0.10","#d8c187"],["0.22","#e6d6a4"],["0.31","#cdbd7e"],["0.40","#9fae5b"],
      ["0.47","#6f8e3f"],["0.53","#557a33"],["0.63","#7e9046"],["0.76","#b7a064"],["0.86","#c2a968"],["1.00","#8c9a56"]]);
    var clip=el("clipPath",{id:"landClip"});
    clip.appendChild(el("path",{d:pathFromLL(MAINLAND)}));
    clip.appendChild(el("path",{d:pathFromLL(MADAGASCAR)}));
    defs.appendChild(clip);
    svg.appendChild(defs);
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"url(#seaGrad)"}));
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"#fff",filter:"url(#ripple)",opacity:"0.06"}));
    svg.appendChild(graticule());
    var land=el("g",{"clip-path":"url(#landClip)"});
    land.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"url(#landGrad)"}));
    land.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"#000",filter:"url(#terrain)",opacity:"0.5"}));
    svg.appendChild(land);
    svg.appendChild(el("path",{d:pathFromLL(MAINLAND),fill:"none",stroke:"#3c3a22","stroke-width":"1.1",opacity:"0.7"}));
    svg.appendChild(el("path",{d:pathFromLL(MADAGASCAR),fill:"none",stroke:"#3c3a22","stroke-width":"1.1",opacity:"0.7"}));
    fx=el("g",{});svg.appendChild(fx);
  }

  // ======================= REAL MODE (true outlines) =======================
  function initReal(data){
    var featByCode=data.byCode;
    var projection=d3.geoEquirectangular().fitSize([W,H],{type:"Polygon",coordinates:[[[lonMin,latMax],[lonMax,latMax],[lonMax,latMin],[lonMin,latMin],[lonMin,latMax]]]});
    var geoPath=d3.geoPath(projection);
    // attach feature to each country we have a polygon for
    AFRICA.forEach(function(c){ var f=featByCode[c.code]; if(f){ c.feat=f; c.cen=d3.geoCentroid(f);} });
    var merged=topojson.merge(data.topo, data.geoms); // dissolve internal borders
    ENG.projectXY=function(lon,lat){return projection([lon,lat]);};
    ENG.invertXY=function(x,y){return projection.invert([x,y]);};
    ENG.centroidXY=function(t){return projection(t.cen||[t.lon,t.lat]);};
    function minEdgeKm(f,lon,lat){
      var best=Infinity,pt=[lon,lat];
      function scan(ring){for(var i=0;i<ring.length;i++){var dd=d3.geoDistance(pt,ring[i]);if(dd<best)best=dd;}}
      var g=f.geometry;
      if(g.type==="Polygon")g.coordinates.forEach(scan);
      else if(g.type==="MultiPolygon")g.coordinates.forEach(function(p){p.forEach(scan);});
      return best*6371;
    }
    ENG.score=function(lon,lat,t){
      if(!t.feat){ // safety: fall back to area method if a polygon is missing
        var d=haversine(lat,lon,t.lat,t.lon),rkm=Math.sqrt(t.a/Math.PI),e=Math.max(0,d-rkm);
        return {inside:d<=rkm,edgeKm:e,pts:d<=rkm?1000:Math.round(1000*Math.exp(-e/700))};
      }
      var inside=d3.geoContains(t.feat,[lon,lat]);
      var edge=inside?0:minEdgeKm(t.feat,lon,lat);
      return {inside:inside, edgeKm:edge, pts: inside?1000:Math.round(1000*Math.exp(-edge/700))};
    };
    ENG.drawHighlight=function(t){
      var c=ENG.centroidXY(t),x=c[0],y=c[1];
      if(t.feat){
        fx.appendChild(el("path",{d:geoPath(t.feat),fill:"#FF1F3D","fill-opacity":"0.34",stroke:"#fff","stroke-width":"2.4","stroke-linejoin":"round"}));
        fx.appendChild(el("path",{d:geoPath(t.feat),fill:"none",stroke:"#FF1F3D","stroke-width":"1.2","stroke-linejoin":"round"}));
      }else{
        fx.appendChild(el("circle",{cx:x,cy:y,r:8,fill:"#FF1F3D","fill-opacity":"0.3",stroke:"#fff","stroke-width":"3"}));
      }
      var b=t.feat?geoPath.bounds(t.feat):[[x-8,y-8],[x+8,y+8]];
      var ly=(b[0][1]-9)<14?(b[1][1]+20):(b[0][1]-9);
      return {x:(b[0][0]+b[1][0])/2, y:y, labelY:ly};
    };
    drawBaseReal(geoPath, merged);
    setMode("real");
    boot2();
  }
  function drawBaseReal(geoPath, merged){
    var defs=defsCommon();
    (function(){var g=el("linearGradient",{id:"landGrad",x1:"0",y1:"0",x2:"0",y2:"1"});
      [["0.00","#9fa15a"],["0.10","#d8c187"],["0.22","#e6d6a4"],["0.31","#cdbd7e"],["0.40","#9fae5b"],["0.47","#6f8e3f"],["0.53","#557a33"],["0.63","#7e9046"],["0.76","#b7a064"],["0.86","#c2a968"],["1.00","#8c9a56"]]
      .forEach(function(s){g.appendChild(el("stop",{offset:s[0],"stop-color":s[1]}));});defs.appendChild(g);})();
    var landD=geoPath(merged);
    var clip=el("clipPath",{id:"landClip"});clip.appendChild(el("path",{d:landD}));defs.appendChild(clip);
    svg.appendChild(defs);
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"url(#seaGrad)"}));
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"#fff",filter:"url(#ripple)",opacity:"0.06"}));
    svg.appendChild(graticule());
    var land=el("g",{"clip-path":"url(#landClip)"});
    land.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"url(#landGrad)"}));
    land.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"#000",filter:"url(#terrain)",opacity:"0.5"}));
    svg.appendChild(land);
    // continent silhouette only — no internal borders shown before the click
    svg.appendChild(el("path",{d:landD,fill:"none",stroke:"#3c3a22","stroke-width":"1.0","stroke-opacity":"0.6","stroke-linejoin":"round"}));
    fx=el("g",{});svg.appendChild(fx);
  }

  // ======================= boot / loading =======================
  function setMode(mode){
    var dot=$("mode").querySelector(".dot"), txt=$("modeText");
    dot.className="dot "+mode;
    if(mode==="real"){txt.textContent="Borders: real country outlines — click inside the border for full points";}
    else{txt.textContent="Borders: approximate area — map data could not load, showing estimated country sizes";}
  }
  function loadScript(url){return new Promise(function(res,rej){var s=document.createElement("script");s.src=url;s.onload=res;s.onerror=function(){rej(new Error("load "+url));};document.head.appendChild(s);});}
  function tryReal(){
    return loadScript("https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js")
      .then(function(){return loadScript("https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js");})
      .then(function(){
        var urls=["https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json","https://unpkg.com/world-atlas@2/countries-110m.json"];
        return urls.reduce(function(p,u){return p.catch(function(){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json();});});},Promise.reject());
      })
      .then(function(topo){
        var obj=topo.objects.countries;
        var fc=topojson.feature(topo,obj);
        var byCode={};
        fc.features.forEach(function(f){ byCode[+f.id]=f; });
        var have=AFRICA.filter(function(c){return byCode[c.code];}).length;
        if(have<20) throw new Error("too few features");
        var codeSet={}; AFRICA.forEach(function(c){codeSet[c.code]=1;});
        var geoms=obj.geometries.filter(function(g){return codeSet[+g.id];});
        initReal({byCode:byCode, topo:topo, geoms:geoms});
      });
  }
  Promise.race([
    tryReal(),
    new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},8000);})
  ]).catch(function(){ if(!started) initApprox(); });

  // ======================= GAME ======================= (boot2 runs after a mode inits)
  var ROUNDS=10, queue=[], idx=0, total=0, current=null, answered=false, started=false;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function pool(){
    var inc=$("islands").checked;
    return AFRICA.filter(function(c){
      if(c.island&&!inc) return false;
      if(ENG._real && !c.feat && c.island) return false; // island polygon absent at this resolution
      return true;
    });
  }
  function startGame(){
    queue=shuffle(pool()).slice(0,ROUNDS); idx=0; total=0; answered=false;
    $("score").textContent="0"; $("final").hidden=true; $("result").hidden=true; $("next").hidden=true;
    nextRound();
  }
  function nextRound(){
    answered=false; clearFx(); $("result").hidden=true; $("next").hidden=true;
    $("hint").style.display=""; svg.classList.remove("locked"); resetView();
    current=queue[idx]; $("country").textContent=current.n; $("roundNum").textContent=(idx+1)+" / "+ROUNDS;
  }
  function clearFx(){ while(fx.firstChild) fx.removeChild(fx.firstChild); }
  function verdict(r,name){
    if(r.inside) return "Bullseye — on "+name;
    if(r.edgeKm<150) return "Just outside";
    if(r.edgeKm<500) return "Close";
    if(r.edgeKm<1200)return "In the region";
    return "Way off";
  }
  function handleGuess(evt){
    if(answered||!current) return;
    var p=svg.createSVGPoint(); var t=evt.touches&&evt.touches[0]?evt.touches[0]:evt;
    p.x=t.clientX; p.y=t.clientY;
    var loc=p.matrixTransform(svg.getScreenCTM().inverse());
    var ll=ENG.invertXY(loc.x,loc.y); var lon=ll[0],lat=ll[1];
    var truth=current, r=ENG.score(lon,lat,truth);
    total+=r.pts; answered=true; svg.classList.add("locked"); $("hint").style.display="none";
    var hl=ENG.drawHighlight(truth);
    travelLine(loc.x,loc.y, hl.x, hl.y);
    pin(loc.x,loc.y,"#3DF0E6");
    label(hl.x, hl.labelY, truth.n);
    $("verdict").textContent=verdict(r,truth.n);
    $("distLine").textContent = r.inside ? ("You landed inside "+truth.n) : (Math.round(r.edgeKm).toLocaleString()+" km outside "+truth.n);
    $("roundPts").textContent="+"+r.pts;
    $("score").textContent=total.toLocaleString();
    $("result").hidden=false; $("next").hidden=false;
    $("next").textContent=(idx+1>=ROUNDS)?"See results →":"Next →"; $("next").focus();
  }
  function grade(s){var p=s/(ROUNDS*1000);
    if(p>=0.9)return"Master cartographer"; if(p>=0.75)return"Seasoned explorer";
    if(p>=0.55)return"Steady navigator"; if(p>=0.35)return"Getting your bearings"; return"Pack a better map";}
  function finish(){
    $("result").hidden=true; $("next").hidden=true; $("country").textContent="—"; $("roundNum").textContent=ROUNDS+" / "+ROUNDS;
    $("finalScore").textContent=total.toLocaleString(); $("finalMax").textContent=(ROUNDS*1000).toLocaleString();
    $("grade").textContent=grade(total); $("final").hidden=false; clearFx();
  }
  function initZoom(){
    // wheel = zoom toward cursor (desktop)
    svg.addEventListener("wheel",function(e){
      e.preventDefault();
      var f=screenToMap(e.clientX,e.clientY);
      zoomAt(f[0],f[1], e.deltaY>0 ? 1.15 : 1/1.15);
    },{passive:false});

    // pointer gestures: 1 pointer = pan (or tap-to-guess), 2 pointers = pinch zoom
    var pointers={}, moved=false, multi=false, last=null, start=null, pinchDist=0;
    var TAP_PX=6;
    function ids(){return Object.keys(pointers);}
    function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

    svg.addEventListener("pointerdown",function(e){
      svg.setPointerCapture(e.pointerId);
      pointers[e.pointerId]={x:e.clientX,y:e.clientY};
      var p=ids();
      if(p.length===1){ moved=false; multi=false; start=last={x:e.clientX,y:e.clientY}; }
      else if(p.length===2){ multi=true; pinchDist=dist(pointers[p[0]],pointers[p[1]]); last=null; }
    });
    svg.addEventListener("pointermove",function(e){
      if(!pointers[e.pointerId]) return;
      pointers[e.pointerId]={x:e.clientX,y:e.clientY};
      var p=ids();
      if(p.length>=2){
        // pinch: zoom about the midpoint
        var a=pointers[p[0]], b=pointers[p[1]], d=dist(a,b);
        var f=screenToMap((a.x+b.x)/2,(a.y+b.y)/2);
        if(pinchDist>0 && d>0) zoomAt(f[0],f[1], pinchDist/d);
        pinchDist=d; moved=true;
      } else if(last){
        // single-pointer pan
        var rect=svg.getBoundingClientRect();
        view.x-=(e.clientX-last.x)*view.w/rect.width;
        view.y-=(e.clientY-last.y)*view.h/rect.height;
        clampView(); applyView();
        last={x:e.clientX,y:e.clientY};
        if(start && Math.hypot(e.clientX-start.x,e.clientY-start.y)>TAP_PX) moved=true;
      }
    });
    function remove(e){
      if(pointers[e.pointerId]) delete pointers[e.pointerId];
      var p=ids();
      if(p.length<2) pinchDist=0;
      if(p.length===1){ last={x:pointers[p[0]].x,y:pointers[p[0]].y}; }
      return p.length;
    }
    svg.addEventListener("pointerup",function(e){
      var wasTap=(!multi && !moved);
      if(remove(e)===0){ if(wasTap) handleGuess(e); last=start=null; moved=false; multi=false; }
    });
    svg.addEventListener("pointercancel",function(e){
      if(remove(e)===0){ last=start=null; moved=false; multi=false; }
    });
  }
  function boot2(){
    if(started) return; started=true;
    initZoom();
    $("next").addEventListener("click",function(){ idx++; if(idx>=ROUNDS) finish(); else nextRound(); });
    $("again").addEventListener("click",startGame);
    $("islands").addEventListener("change",startGame);
    startGame();
  }
  // mark real mode flag for pool()
  var _initReal=initReal; initReal=function(b){ ENG._real=true; _initReal(b); };
})();
</script>
</body>
